<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>2급 한자 암기테스트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;700;900&display=swap">
<style>
/* Layout: one narrow answer-sheet column; setup → question card on a 원고지 cell → result sheet with red-ink marks */
:root{
  --paper:#eef1ec; --sheet:#fbfcfa; --ink:#1b2220; --muted:#5f6b66; --rule:#cfd7cf; --cell:#e3e9e2;
  --seal:#c4362c; --seal-soft:#f6dcd8; --ok:#1d7552; --ok-soft:#d8ece2; --bad:#b0281f; --bad-soft:#f6dcd9;
  --chip:#e4e9e3; --chip-on:#1b2220; --chip-on-fg:#fbfcfa; --focus:#2b6cb0;
  --f-han:"Noto Serif KR","Noto Serif CJK KR","Source Han Serif K","Batang","AppleMyungjo",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121614; --sheet:#1a1f1d; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#2f3834; --cell:#232a27;
  --seal:#ff6b5d; --seal-soft:#3d2220; --ok:#5fcf9c; --ok-soft:#173027; --bad:#ff7a70; --bad-soft:#3a1d1b;
  --chip:#252c29; --chip-on:#e6ebe7; --chip-on-fg:#121614; --focus:#7fb3ff; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121614; --sheet:#1a1f1d; --ink:#e6ebe7; --muted:#9aa6a0; --rule:#2f3834; --cell:#232a27;
  --seal:#ff6b5d; --seal-soft:#3d2220; --ok:#5fcf9c; --ok-soft:#173027; --bad:#ff7a70; --bad-soft:#3a1d1b;
  --chip:#252c29; --chip-on:#e6ebe7; --chip-on-fg:#121614; --focus:#7fb3ff; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.han{font-family:var(--f-han)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.mast h1{font-family:var(--f-han);font-weight:900;font-size:1.65rem;letter-spacing:-.01em;line-height:1.2}
.mast h1 small{display:block;font-family:var(--f-ui);font-weight:500;font-size:.78rem;color:var(--muted);letter-spacing:.06em}
.mast .grade{font-family:var(--f-han);font-weight:900;color:var(--seal);border:2px solid var(--seal);border-radius:6px;padding:2px 8px;font-size:1.05rem;white-space:nowrap;transform:rotate(-4deg)}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{font-size:1rem;font-weight:600}
.sec-h .sub{color:var(--muted);font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.08em;color:var(--muted);font-weight:600}
.range{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{display:flex;flex-direction:column;gap:4px}
.num input{width:7.5em;font:inherit;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 10px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.dash{font-size:1.2rem;color:var(--muted);padding-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.85rem;line-height:1.3}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip small{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.strip{font-family:var(--f-han);font-size:1.25rem;color:var(--ink);letter-spacing:.12em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;flex:1 1 200px}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.type{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:transparent;border-radius:8px;padding:10px 12px}
.type .box{flex:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:4px;margin-top:3px;display:grid;place-items:center;font-size:.75rem}
.type[aria-pressed="true"]{border-color:var(--ink)}
.type[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.type b{display:block;font-weight:600}
.type b .han{font-weight:700;margin-right:4px}
.type span{display:block;font-size:.78rem;color:var(--muted);line-height:1.4}
.opts{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
.opt{display:flex;flex-direction:column;gap:6px}
.toggle{display:flex;gap:8px;align-items:center;font-size:.88rem}
.toggle input{width:18px;height:18px;accent-color:var(--ink)}
.toggle input#learnTo{width:6.5em;height:auto;font:inherit;font-weight:600;font-variant-numeric:tabular-nums;padding:5px 8px;border:1.5px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.learn{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.unk{color:var(--muted);opacity:.55}
.note{font-size:.8rem;color:var(--muted);margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:8px;padding:12px 18px;font-weight:600;background:var(--ink);color:var(--sheet)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--rule)}
.btn.seal{background:var(--seal);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{flex:1 1 auto}
.warn{color:var(--bad);font-size:.85rem}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;background:var(--cell);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.count{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);white-space:nowrap}
.quit{background:none;border:none;color:var(--muted);font-size:.85rem;padding:4px}
.qcard{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px;position:relative}
.qhead{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.qno{font-family:var(--f-han);font-weight:900;font-size:1.1rem}
.qtype{font-size:.72rem;letter-spacing:.06em;font-weight:600;color:var(--seal);border:1px solid var(--seal);border-radius:4px;padding:1px 6px}
.qins{font-family:var(--f-han);font-size:.98rem;flex-basis:100%}
.stage{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:6px;padding:8px 0}
.cellbox{width:132px;height:132px;display:grid;place-items:center;font-family:var(--f-han);font-size:88px;line-height:1;border:1.5px solid var(--rule);background:
  linear-gradient(var(--cell),var(--cell)) center/1px 100% no-repeat,
  linear-gradient(var(--cell),var(--cell)) center/100% 1px no-repeat, var(--sheet)}
.word{font-family:var(--f-han);font-size:2.6rem;letter-spacing:.06em;font-weight:700;text-align:center;line-height:1.3}
.word u{text-decoration:none;border-bottom:3px solid var(--seal)}
.word .blank{display:inline-block;width:1.1em;border-bottom:3px solid var(--seal);color:transparent}
.reading{font-size:1.05rem;color:var(--muted);letter-spacing:.1em}
.reading mark{background:var(--seal-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.hunq{font-family:var(--f-han);font-size:1.7rem;font-weight:700;text-align:center}
.hint{font-size:.88rem;color:var(--muted);text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices.long{grid-template-columns:1fr}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px 12px;min-height:52px}
.choice .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.78rem;font-weight:600;color:var(--muted)}
.choice .v{min-width:0}
.choice .v.big{font-family:var(--f-han);font-size:1.7rem;line-height:1.2}
.choice .v.mid{font-family:var(--f-han);font-size:1.3rem}
.choice .v small{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--muted)}
.choice:hover:not(:disabled){border-color:var(--ink)}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .k{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.answer-row{display:flex;gap:8px}
.answer-row input{flex:1;min-width:0;font:inherit;font-size:1.15rem;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
.pad{display:flex;flex-direction:column;gap:6px;align-items:center}
.pad canvas{width:220px;height:220px;max-width:100%;border:1.5px solid var(--rule);border-radius:6px;touch-action:none;background:
  linear-gradient(var(--cell),var(--cell)) center/1px 100% no-repeat,
  linear-gradient(var(--cell),var(--cell)) center/100% 1px no-repeat, var(--paper)}
.pad .row{display:flex;gap:8px}
.mini{font-size:.8rem;padding:6px 10px;border-radius:6px;border:1px solid var(--rule);background:transparent}
.fb{display:flex;align-items:center;gap:12px;font-weight:600}
.mark{flex:none;width:44px;height:44px;display:grid;place-items:center}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.fb .sub{font-weight:400;color:var(--muted);font-size:.85rem}
.info{border-top:1px dashed var(--rule);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.info .big{grid-row:span 5;font-family:var(--f-han);font-size:3.4rem;line-height:1;padding-right:4px}
.info dt{display:none}
.info .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.info .hun{font-family:var(--f-han);font-size:1.15rem;font-weight:700}
.info .exs{font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 12px}
.info .exs span .han{font-size:1.05rem}
.nextbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.selfgrade{display:flex;gap:8px}
/* result */
.score{display:flex;align-items:center;gap:18px}
.score .ring{position:relative;width:110px;height:110px;flex:none}
.score .pts{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-han);font-weight:900;font-size:2rem;color:var(--seal);font-variant-numeric:tabular-nums}
.score .what{display:flex;flex-direction:column;gap:2px}
.score .what b{font-size:1.15rem}
.bytype{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.bytype td{padding:6px 4px;border-bottom:1px solid var(--rule)}
.bytype td:last-child{text-align:right;color:var(--muted)}
.wlist{display:flex;flex-direction:column}
.witem{display:grid;grid-template-columns:3rem 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.witem .c{grid-row:span 2;font-family:var(--f-han);font-size:2.2rem;line-height:1;align-self:center}
.witem .l1{font-family:var(--f-han);font-weight:700}
.witem .l1 small{font-family:var(--f-ui);font-weight:400;color:var(--muted);font-size:.75rem;margin-left:6px}
.witem .l2{font-size:.82rem;color:var(--muted);min-width:0}
.witem .l2 s{color:var(--bad)}
@media (max-width:460px){
  .choices{grid-template-columns:1fr}
  .cellbox{width:112px;height:112px;font-size:74px}
  .word{font-size:2.2rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .28s ease-out}
/* tabs & records */
.tabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--rule)}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:8px 14px 9px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal)}
.sync{margin-left:auto;font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);min-width:0}
.tile b{font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tile b small{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:2px}
.tile span{font-size:.75rem;color:var(--muted)}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:8px;border-radius:2px;display:inline-block}
.gbars{display:flex;flex-direction:column;gap:8px}
.grow{display:grid;grid-template-columns:4.6rem 1fr 6.2rem;gap:10px;align-items:center;font-size:.85rem}
.grow .gl{font-weight:600;white-space:nowrap}
.grow .gn{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.78rem;white-space:nowrap}
.track{position:relative;height:12px;background:var(--cell);border-radius:3px;overflow:hidden}
.track .tried{position:absolute;inset:0 auto 0 0;background:var(--seal-soft);border-radius:0 4px 4px 0}
.track .mast2{position:absolute;inset:0 auto 0 0;background:var(--seal);border-radius:0 4px 4px 0}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.chartbox .axis{fill:var(--muted);font-size:11px;font-family:var(--f-ui)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--sheet);font-size:.75rem;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);font-variant-numeric:tabular-nums}
.slist{display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center;text-align:left;background:none;border-left:none;border-right:none;border-top:none;width:100%}
.srow .d{font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--muted);white-space:nowrap}
.srow .m{min-width:0}
.srow .m b{font-weight:600}
.srow .m span{display:block;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .p{font-family:var(--f-han);font-weight:900;font-size:1.25rem;font-variant-numeric:tabular-nums}
.srow .p.pass{color:var(--seal)}
.sdetail{padding:4px 0 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--rule)}
.weak{display:flex;flex-wrap:wrap;gap:6px}
.weak>span{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--rule);border-radius:6px;padding:4px 8px;background:var(--sheet)}
.weak .han{font-size:1.3rem}
.weak small{color:var(--bad);font-size:.72rem;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem;text-align:center;padding:18px 8px}
@keyframes pop{from{transform:scale(.6) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
</style>

<div class="wrap" id="app">
  <header class="mast">
    <h1><small>韓國語文會 漢字能力檢定 · 配定漢字 2,355字</small>2급 한자 암기테스트</h1>
    <div class="grade han">二級</div>
  </header>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" id="tabTest" aria-selected="true">시험</button>
    <button class="tab" role="tab" id="tabRec" aria-selected="false">기록</button>
    <span class="sync" id="sync"><i></i><span id="syncText">기록 불러오는 중</span></span>
  </nav>

  <!-- SETUP -->
  <section id="setup" style="display:flex;flex-direction:column;gap:16px">
    <div class="sheet">
      <div class="sec-h"><h2>출제 범위</h2><span class="sub">연습장 번호 1 – 2,355</span></div>
      <div class="range">
        <label class="num"><span class="label">시작 번호</span><input id="from" type="number" inputmode="numeric" min="1" max="2355" value="1"></label>
        <span class="dash">–</span>
        <label class="num"><span class="label">끝 번호</span><input id="to" type="number" inputmode="numeric" min="1" max="2355" value="50"></label>
      </div>
      <div class="chips" id="presets"></div>
      <div class="preview"><span id="rangeCount"></span><span class="strip" id="rangeStrip"></span></div>
    </div>

    <div class="sheet">
      <div class="sec-h"><h2>문제 유형</h2><span class="sub">여러 개 고르면 섞어서 냅니다</span></div>
      <div class="types" id="types"></div>
    </div>

    <div class="sheet">
      <div class="sec-h"><h2>풀이 방식</h2></div>
      <div class="opts">
        <div class="opt"><span class="label">문항 수</span><div class="chips" id="counts"></div></div>
        <div class="opt"><span class="label">순서</span><div class="chips" id="orders"></div></div>
      </div>
      <label class="toggle"><input type="checkbox" id="typed" checked> 훈음·독음은 직접 입력해서 풀기 (끄면 4지선다)</label>
      <label class="toggle"><input type="checkbox" id="incl2"> 2급 신출자(1818~)도 쓰기 문제에 포함</label>
      <div class="learn">
        <label class="toggle"><input type="checkbox" id="learnOn"> 예시어·보기는 배운 글자로만</label>
        <label class="toggle" for="learnTo">배운 데까지 <input id="learnTo" type="number" inputmode="numeric" min="1" max="2355"> 번</label>
      </div>
      <p class="note" id="learnNote"></p>
      <p class="note">실제 시험의 한자 쓰기는 쓰기배정 1,817자(1~1817번)에서만 나옵니다. 그래서 기본값에서는 직접 쓰기·한자어 쓰기에서 1818번 이후 글자를 뺍니다.</p>
    </div>

    <div class="sheet" id="noteBox" hidden>
      <div class="sec-h"><h2>오답노트</h2><span class="sub" id="noteSub"></span></div>
      <div class="strip" id="noteStrip" style="white-space:normal"></div>
      <div class="cta"><button class="btn ghost" id="noteRun">이 범위 오답만 풀기</button><button class="btn ghost" id="noteClear">오답노트 비우기</button></div>
      <div id="noteConfirm" hidden class="cta"><span class="warn">오답노트를 모두 지울까요?</span><button class="btn seal" id="noteYes">지우기</button><button class="btn ghost" id="noteNo">취소</button></div>
    </div>

    <div class="cta"><button class="btn wide" id="start">시험 시작</button></div>
    <p class="warn" id="startMsg" hidden></p>
  </section>

  <!-- QUIZ -->
  <section id="quiz" hidden style="display:flex;flex-direction:column;gap:14px">
    <div class="qtop"><div class="bar"><i id="barFill"></i></div><span class="count" id="qcount"></span><button class="quit" id="quit">그만 풀기</button></div>
    <article class="qcard" id="qcard"></article>
  </section>

  <!-- RECORDS -->

const RADFORM = {'氵':['水','물수'],'氺':['水','물수'],'亻':['人','사람인'],'扌':['手','손수'],'忄':['心','마음심'],'㣺':['心','마음심'],'艹':['艸','풀초'],'礻':['示','보일시'],'衤':['衣','옷의'],'犭':['犬','개견'],'灬':['火','불화'],'辶':['辵','쉬엄쉬엄갈착'],'罒':['网','그물망'],'覀':['襾','덮을아'],'刂':['刀','칼도'],'攵':['攴','칠복'],'飠':['食','밥식'],'耂':['老','늙을로'],'爫':['爪','손톱조'],'王':['玉','구슬옥']};
function radD(rad, radn){

}

/* distractor chooser: same-radical, same-sound, in-range, global — dedup by key */
function distract(c, n, keyFn, range){
  const out=[], seen=new Set([keyFn(c)]);
  const add = x => { if(!x||x===c||out.length>=n) return; const k=keyFn(x); if(k==null||seen.has(k)) return; seen.add(k); out.push(x); };
  const L=lim(), ok = x => x.n<=L;
  const a = shuffle((BYRAD.get(radKey(c))||[]).filter(ok)), b = shuffle(c.eums.flatMap(e=>BYEUM.get(e)||[]).filter(ok));
  for (let i=0; out.length<n && i<4; i++){ add(a[i]); add(b[i]); }
  for (const x of shuffle(range)) { if(out.length>=n) break; add(x); }
  for (const x of shuffle(ALL.slice(0,L))) { if(out.length>=n) break; add(x); }
  for (const x of shuffle(ALL)) { if(out.length>=n) break; add(x); }
  return out;
}
const normHun = s => s.replace(/\[[^\]]*\]|\([^)]*\)|［[^］]*］/g,'').replace(/[\s·,.]/g,'');
function hunAccept(c){
  const set = new Set();
  for (const l of c.L){ set.add(normHun(l.full)); for (const h of l.hun.split('·')) set.add(normHun(h+l.eum)); }
  return set;
}

const WRITE_TYPES = new Set(['write','word']);

function wordWriteCands(c){
  const res=[];
  const L=lim();
  for (const e of exOf(c)){
    const i = [...e.w].indexOf(c.h); if(i<0) continue;
    const syl = [...e.r][i];
    const pool0 = (BYEUM.get(syl)||[]).concat(c.eums.flatMap(x=>BYEUM.get(x)||[])).filter(x=>x!==c);
    const pool = shuffle(pool0.filter(x=>x.n<=L)).concat(shuffle(ALL.slice(0,L).filter(x=>x!==c)), shuffle(pool0.filter(x=>x.n>L)));
    const wrongs=[]; const seen=new Set();
    for (const x of pool){ const arr=[...e.w]; arr[i]=x.h; const w=arr.join(''); if(seen.has(w)||WORDSET.has(w)) continue; seen.add(w); wrongs.push({w, by:x}); if(wrongs.length>=3) break; }
    if (wrongs.length>=3) res.push({e, i, wrongs});
  }
  return res;
}
function homoCands(c){ const res=[]; for(const e of exOf(c)){ const alt=(BYREAD.get(e.r)||[]).filter(x=>x.w!==e.w && known(x.w)); if(alt.length) res.push({e,alt}); } return res; }
function idiomCands(c){ return exOf(c).filter(e=>[...e.w].length===4 && e.w.includes(c.h)); }

function feasible(t, c, incl2){
  if (WRITE_TYPES.has(t) && c.n>=1818 && !incl2) return false;
  switch(t){
    case 'dok': return exOf(c).length>0;
    case 'word': return wordWriteCands(c).length>0;
    case 'yak': return !!YAK[c.h];
    case 'homo': return homoCands(c).length>0;
    case 'idiom': return idiomCands(c).length>0;
    default: return true;
  }
}

function dokDistract(e){
  const chars=[...e.w], syl=[...e.r], out=new Set();
  for (let tries=0; tries<40 && out.size<3; tries++){
    const i=Math.floor(Math.random()*chars.length); const src=BYH.get(chars[i]);
    let alt;
    if (src){ const sim=(BYRAD.get(radKey(src))||[]).filter(x=>x!==src); const x=pick(sim.length?sim:ALL); alt=pick(x.eums); }
    else alt=pick(pick(ALL).eums);
    if (!alt || alt===syl[i]) continue;
    const s=syl.slice(); s[i]=alt; const r=s.join(''); if(r!==e.r) out.add(r);
  }
  for (const p of shuffle(POOL)){ if(out.size>=3) break; if(p.r.length===e.r.length && p.r!==e.r) out.add(p.r); }
  return [...out].slice(0,3);
}

function build(t, c, range, typed){
  const q = {t, n:c.n, c};
  if (t==='hun'){
    q.stage = `<div class="cellbox">${esc(c.h)}</div>`;
    if (typed){ q.mode='text'; q.accept=hunAccept(c); q.placeholder='예: 날 일'; q.answerText=c.hun; }
    else { q.mode='mc'; const ds=distract(c,3,x=>x.hun,range); q.options=shuffle([c,...ds]).map(x=>({html:`<span class="v mid">${esc(x.hun)}</span>`, ok:x===c, label:x.hun})); q.long=true; }
  } else if (t==='pick'){
    q.stage = `<div class="hunq">${esc(c.hun)}</div>`;
    q.mode='mc'; const ds=distract(c,3,x=>x.h,range); q.options=shuffle([c,...ds]).map(x=>({html:`<span class="v big">${esc(x.h)}</span>`, ok:x===c, label:x.h}));
  } else if (t==='write'){
    q.stage = `<div class="hunq">${esc(c.hun)}</div>`; q.mode='self';
  } else if (t==='dok'){
    const e=pick(exOf(c)); q.e=e;
    q.stage = `<div class="word">${[...e.w].map(ch=>ch===c.h?`<u>${esc(ch)}</u>`:esc(ch)).join('')}</div>`;
    if (typed){ q.mode='text'; q.accept=new Set([e.r]); q.placeholder='한글로 입력'; q.answerText=e.r; }
    else { q.mode='mc'; q.options=shuffle([e.r,...dokDistract(e)]).map(r=>({html:`<span class="v mid">${esc(r)}</span>`, ok:r===e.r, label:r})); }
  } else if (t==='word'){
    const cand=pick(wordWriteCands(c)); const {e,i}=cand; q.e=e;
    const rs=[...e.r];
    const line = c.L.find(l=>l.eum===rs[i]) || c.L[0];
    q.stage = `<div class="reading" style="font-size:1.9rem;color:var(--ink);font-weight:600">${rs.map((s,j)=>j===i?`<mark>${esc(s)}</mark>`:esc(s)).join('')}</div><div class="hint">표시한 글자의 뜻: ${esc(line.hun)}</div>`;
    q.mode='mc'; q.options=shuffle([{w:e.w, ok:true},...cand.wrongs.map(x=>({w:x.w, ok:false}))]).map(o=>({html:`<span class="v mid">${esc(o.w)}</span>`, ok:o.ok, label:o.w}));
  } else if (t==='rad'){
    q.stage = `<div class="cellbox">${esc(c.h)}</div>`;
    const key=radKey(c); const rd=radD(c.rad,c.radn); const ans={main:rd.main, name:rd.name, key};
    const seen=new Set([key]); const ds=[];
    const near = shuffle(RADS.filter(r=>!seen.has(r.key)));
    for (const r of near){ if(seen.has(r.key)) continue; seen.add(r.key); ds.push(r); if(ds.length>=3) break; }
    q.mode='mc'; q.options=shuffle([ans,...ds]).map(r=>({html:`<span class="v big">${esc(r.main)}<small>${esc(r.name)}</small></span>`, ok:r===ans, label:r.main}));
  } else if (t==='yak'){
    q.stage = `<div class="cellbox">${esc(c.h)}</div>`;
    const ans=YAK[c.h]; const L=lim();
    const kv=Object.entries(YAK).filter(([k,v])=>v!==ans && BYH.get(k).n<=L).map(x=>x[1]);
    const ds=shuffle(kv).concat(shuffle(YAKVALS.filter(v=>v!==ans && !kv.includes(v)))).slice(0,3);
    q.mode='mc'; q.options=shuffle([ans,...ds]).map(v=>({html:`<span class="v big">${esc(v)}</span>`, ok:v===ans, label:v}));
  } else if (t==='homo'){
    const {e,alt}=pick(homoCands(c)); const a=pick(alt); q.e=e; q.alt=a;
    q.stage = `<div class="word">${esc(e.w)}</div>`;
    const ds=[]; const seen=new Set([e.r]);
    const KP = POOL.filter(p=>known(p.w));
    const tricky = shuffle(KP.filter(p=>p.w!==e.w && p.r!==e.r && p.w.length===e.w.length && [...p.w].some(ch=>e.w.includes(ch))));
    for (const p of tricky.concat(shuffle(KP.filter(p=>p.w.length===e.w.length)), shuffle(POOL.filter(p=>p.w.length===e.w.length)))){ if(ds.length>=3) break; if(seen.has(p.r)||p.w===a.w) continue; seen.add(p.r); ds.push(p); }
    q.mode='mc'; q.options=shuffle([a,...ds]).map(p=>({html:`<span class="v mid">${esc(p.w)}</span>`, ok:p===a, label:`${p.w}(${p.r})`, read:p.r}));
  } else if (t==='idiom'){
    const e=pick(idiomCands(c)); q.e=e;
    q.stage = `<div class="word">${[...e.w].map(ch=>ch===c.h?`<span class="blank">${esc(ch)}</span>`:esc(ch)).join('')}</div><div class="reading">${esc(e.r)}</div>`;
    const ds=distract(c,3,x=>x.h,range);
    q.mode='mc'; q.options=shuffle([c,...ds]).map(x=>({html:`<span class="v big">${esc(x.h)}</span>`, ok:x===c, label:x.h}));
  }
  return q;
}

/* ---------- state & storage ---------- */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const S = Object.assign({from:1,to:50,types:['hun','pick','dok','rad'],count:20,order:'rand',typed:true,incl2:false,learnOn:true,learnTo:0}, store.get('hj2-setup',{}));
/* progress: chars[n] = [맞힌 횟수, 틀린 횟수, 마지막 정답여부(1/0), 마지막 시각 ms]; wrong[n] = 오답노트 */
let P = store.get('hj2-progress', null) || {chars:{}, wrong:store.get('hj2-wrong',{}), updated:0};
P.chars = P.chars||{}; P.wrong = P.wrong||{};
let wrongNote = P.wrong;
let SESS = store.get('hj2-sessions', []);
const R = {db:null, uid:null, ready:false, writing:Promise.resolve()};
function progRef(){ return R.db.doc('data/users/'+R.uid+'/progress'); }
function mergeProgress(a, b){
  const out={chars:{}, wrong:{}, updated:Math.max(a.updated||0,b.updated||0)};
  for (const src of [a,b]) for (const [n,v] of Object.entries(src.chars||{})){ const cur=out.chars[n]; if(!cur || (v[3]||0)>(cur[3]||0)) out.chars[n]=v.slice(); }
  // 오답노트: 그 글자의 가장 최근 답이 오답이면 남김
  for (const src of [a,b]) for (const [n,c] of Object.entries(src.wrong||{})){ const st=out.chars[n]; if(!st || st[2]===0) out.wrong[n]=Math.max(out.wrong[n]||0,c); }
  return out;
}
function persistLocal(){ store.set('hj2-progress',P); store.set('hj2-sessions',SESS.slice(0,200)); }
function persist(){
  P.updated=Date.now(); persistLocal();
  if (!R.ready) return Promise.resolve();
  const body = JSON.parse(JSON.stringify(P));
  R.writing = R.writing.then(()=>progRef().set(body)).catch(e=>{ setSync(false, e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼습니다':'계정 저장 실패 · 이 브라우저에는 저장됨'); });
  return R.writing;
}
function addSession(s){
  SESS.unshift(s); persistLocal();
  if (!R.ready) return;
  R.writing = R.writing.then(()=>progRef().collection('sessions').doc(s.id).set(s)).catch(e=>{ setSync(false,'계정 저장 실패 · 이 브라우저에는 저장됨'); });
}
function setSync(on, text){ $('sync').classList.toggle('on',!!on); $('syncText').textContent=text; }
async function initRemote(){
  if (!window.claude || typeof window.claude.use!=='function'){ setSync(false,'이 브라우저에만 저장'); return; }
  try{
    const [db,user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid){ setSync(false,'이 브라우저에만 저장 (로그인하면 계정에 저장)'); return; }
    R.db=db; R.uid=uid;
    const snap = await progRef().get();
    const remote = snap.exists ? snap.data() : null;
    const local = P;
    P = remote ? mergeProgress(remote, local) : mergeProgress({chars:{},wrong:{}}, local);
    wrongNote = P.wrong;
    const qs = await progRef().collection('sessions').orderBy('ts','desc').limit(200).get();
    const remoteS = qs.docs.map(d=>d.data());
    const ids = new Set(remoteS.map(s=>s.id));
    const onlyLocal = SESS.filter(s=>s && s.id && !ids.has(s.id));
    SESS = remoteS.concat(onlyLocal).sort((x,y)=>y.ts-x.ts);
    R.ready = true;
    setSync(true,'내 계정에 저장 중');
    const needPush = !remote || JSON.stringify(remote.chars||{})!==JSON.stringify(P.chars) || JSON.stringify(remote.wrong||{})!==JSON.stringify(P.wrong);
    if (needPush && (Object.keys(P.chars).length || Object.keys(P.wrong).length)) await persist();
    for (const s of onlyLocal){ R.writing = R.writing.then(()=>progRef().collection('sessions').doc(s.id).set(s)).catch(()=>{}); }
    persistLocal();
    updatePreview(); if(!$('records').hidden) renderRecords();
  }catch(e){ setSync(false,'이 브라우저에만 저장'); }
}

/* ---------- quiz generation ---------- */
function makePlan(chars, types){
  const range = chars;
  const used = Object.fromEntries(types.map(t=>[t,0]));
  const target = S.count>0 ? S.count : chars.length;
  const list=[]; const done=new Set();
  let order = S.order==='seq' ? chars.slice() : shuffle(chars);
  for (let round=0; list.length<target && round<types.length; round++){
    for (const c of order){
      if (list.length>=target) break;
      const ok = types.filter(t=>!done.has(t+c.n) && feasible(t,c,S.incl2));
      if (!ok.length) continue;
      ok.sort((x,y)=>used[x]-used[y] || Math.random()-.5);
      const t=ok[0]; used[t]++; done.add(t+c.n); list.push({t,c});
    }
    if (S.order!=='seq') order = shuffle(chars);
  }
  if (S.order==='seq') list.sort((x,y)=>x.c.n-y.c.n);
  return list.map(({t,c})=>build(t,c,range,S.typed));
}
function startQuiz(plan, label){
  if (!plan.length){ $('startMsg').hidden=false; $('startMsg').textContent='고른 범위와 유형으로 만들 수 있는 문제가 없습니다. 독음·동음이의어·사자성어·약자는 해당 예시가 있는 글자에서만 나오니, 유형을 더 고르거나 범위를 넓혀 보세요.'; return; }
  $('startMsg').hidden=true;

  showQ();
  window.scrollTo({top:0});
}

const MARK_OK = `<svg class="mark pop" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="17" fill="none" stroke="var(--seal)" stroke-width="3.5" stroke-dasharray="100 8" transform="rotate(-70 22 22)"/></svg>`;
const MARK_NO = `<svg class="mark pop" viewBox="0 0 44 44" aria-hidden="true"><path d="M10 34 L34 10" stroke="var(--seal)" stroke-width="4" stroke-linecap="round" fill="none"/></svg>`;

function infoHTML(q){
  const c=q.c;
  const L=lim();
  const exSorted = exOf(c).concat(c.ex.filter(e=>!known(e.w)));
  const exs = exSorted.map(e=>`<span><span class="han">${[...e.w].map(ch=>{ const x=BYH.get(ch); return (!x||x.n<=L)?esc(ch):`<span class="unk" title="${x?x.n+'번 · 아직 안 배움':'배정한자 밖'}">${esc(ch)}</span>`; }).join('')}</span> ${esc(e.r)}</span>`).join('');
  let extra='';
  if (q.t==='homo') extra = `<div class="exs"><span><span class="han">${esc(q.e.w)}</span> ${esc(q.e.r)}</span><span>= 소리 같음 =</span><span><span class="han">${esc(q.alt.w)}</span> ${esc(q.alt.r)}</span></div>`;
  if (q.t==='yak') extra = `<div class="exs"><span>약자 <span class="han" style="font-size:1.4rem">${esc(YAK[c.h])}</span></span></div>`;
  return `<div class="info">
    <div class="big">${esc(c.h)}</div>
    <div class="hun">${esc(c.hun)}</div>
    <div class="meta">${c.n}번 · ${esc(c.g)} · 부수 ${(d=>d.v?`<span class="han">${esc(d.main)}</span>(${esc(d.v)}) ${esc(d.name)} · ${esc(d.vn)}`:`<span class="han">${esc(d.main)}</span> ${esc(d.name)}`)(radD(c.rad,c.radn))} · ${c.st}획${YAK[c.h]&&q.t!=='yak'?` · 약자 <span class="han">${esc(YAK[c.h])}</span>`:''}</div>
    ${extra}

function showQ(){

function record(ok, mine, override){
  const q=quiz.qs[quiz.i];
  quiz.res[quiz.i]={ok, mine, q};
  const st = P.chars[q.n] || [0,0,0,0];
  if (override){ st[1]=Math.max(0,st[1]-1); }
  if (ok) st[0]++; else st[1]++;
  st[2]=ok?1:0; st[3]=Date.now(); P.chars[q.n]=st;
  if (ok){ if(wrongNote[q.n]) { delete wrongNote[q.n]; } }
  else wrongNote[q.n]=(wrongNote[q.n]||0)+1;
  persistLocal();
}
function after(ok, msg){
  const q=quiz.qs[quiz.i]; const last = quiz.i===quiz.qs.length-1;
  $('after').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">
    <div class="fb ${ok?'ok':'no'}" id="fbline">${ok?MARK_OK:MARK_NO}<div>${ok?'맞았습니다':'틀렸습니다'}${msg?`<div class="sub">${msg}</div>`:''}</div></div>
    ${infoHTML(q)}
    <div class="nextbar">${(!ok && q.mode==='text')?'<button class="btn ghost" id="override">맞게 쓴 답이에요</button>':''}<button class="btn" id="next">${last?'결과 보기':'다음 문제'}</button></div></div>`;
  $('next').addEventListener('click',next);
  const ov=$('override'); if(ov) ov.addEventListener('click',()=>{ const r=quiz.res[quiz.i]; record(true, r.mine, true); quiz.res[quiz.i].overridden=true; after(true,'정답으로 처리했습니다.'); });
  $('next').focus({preventScroll:true});
  $('after').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'nearest'});
}
function answerMC(j){
  const q=quiz.qs[quiz.i]; if(quiz.res[quiz.i]) return;
  const ok=q.options[j].ok;
  document.querySelectorAll('#choices .choice').forEach((b,k)=>{ b.disabled=true; if(q.options[k].ok) b.classList.add('right'); else if(k===j) b.classList.add('wrong'); });
  record(ok, q.options[j].label);
  let msg = ok?'':`정답 ${'①②③④'[q.options.findIndex(o=>o.ok)]}`;
  if (q.t==='homo'){ msg = q.options.map((o,k)=>`${'①②③④'[k]} ${o.label}`).join(' · '); }
  after(ok, msg);
}
function answerText(v){
  const q=quiz.qs[quiz.i]; if(quiz.res[quiz.i]) return;
  const raw=v.trim(); if(!raw){ $('tin').focus(); return; }
  const parts = raw.split(/[\/,]/).map(s=>q.t==='hun'?normHun(s):s.replace(/\s/g,'')).filter(Boolean);
  const ok = parts.some(p=>q.accept.has(p));
  $('tin').disabled=true; document.querySelector('#tform button').disabled=true;
  record(ok, raw);
  after(ok, ok?'':`정답: ${esc(q.answerText)} · 내 답: ${esc(raw)}`);
}
function reveal(){
  const q=quiz.qs[quiz.i];
  $('reveal').disabled=true;
  $('after').innerHTML = `<div style="display:flex;flex-direction:column;gap:14px">${infoHTML(q)}
    <div class="nextbar"><span class="note" style="align-self:center">내가 쓴 글자가 맞았나요?</span><button class="btn ghost" id="selfNo">틀렸어요</button><button class="btn" id="selfOk">맞았어요</button></div></div>`;
  $('selfOk').addEventListener('click',()=>{ record(true,'(직접 씀)'); after(true,''); });
  $('selfNo').addEventListener('click',()=>{ record(false,'(직접 씀)'); after(false,''); });
  $('after').scrollIntoView({block:'nearest'});
}
function next(){ if(quiz.i<quiz.qs.length-1){ quiz.i++; showQ(); window.scrollTo({top:0}); } else showResult(); }
document.addEventListener('keydown',e=>{
  if (!quiz || $('quiz').hidden) return;
  const q=quiz.qs[quiz.i];
  if (q.mode==='mc' && !quiz.res[quiz.i] && /^[1-4]$/.test(e.key)) { answerMC(+e.key-1); }
  else if (quiz.res[quiz.i] && e.key==='Enter' && document.activeElement?.id!=='override') { e.preventDefault(); next(); }
});

/* handwriting pad */
function setupPad(){
  const cv=$('cv'), ctx=cv.getContext('2d'); let drawing=false, last=null;
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#1b2220';
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=12; ctx.strokeStyle=ink;
  const pos = e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last[0],last[1],5,0,7); ctx.fillStyle=ink; ctx.fill(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last=p; });
  const end=()=>{drawing=false;}; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  $('cvClear').addEventListener('click',()=>ctx.clearRect(0,0,cv.width,cv.height));
}

/* ---------- results ---------- */
function saveQuiz(){
  if (!quiz || quiz.saved) return; const res=quiz.res.filter(Boolean); if(!res.length) return;
  quiz.saved=true;
  const by={}; for(const r of res){ const k=r.q.t; by[k]=by[k]||[0,0]; by[k][1]++; if(r.ok) by[k][0]++; }
  const ts=Date.now();
  addSession({id:'s'+ts.toString(36)+Math.random().toString(36).slice(2,6), ts, label:quiz.label, total:res.length, right:res.filter(r=>r.ok).length,
    by, wrong:res.filter(r=>!r.ok).map(r=>[r.q.n,r.q.t]), from:S.from, to:S.to});
  persist();
}
function showResult(){
  saveQuiz();
  const res = quiz.res.filter(Boolean); const total=res.length; const right=res.filter(r=>r.ok).length;
  const pct = total?Math.round(right/total*100):0;
  const by={}; for(const r of res){ const k=r.q.t; by[k]=by[k]||[0,0]; by[k][1]++; if(r.ok) by[k][0]++; }
  const wrong = res.filter(r=>!r.ok);
  const circ=2*Math.PI*46;
  $('result').innerHTML = `
  <div class="sheet">
    <div class="score">
      <div class="ring"><svg viewBox="0 0 110 110" width="110" height="110"><circle cx="55" cy="55" r="46" fill="none" stroke="var(--cell)" stroke-width="8"/><circle cx="55" cy="55" r="46" fill="none" stroke="var(--seal)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${circ*pct/100} ${circ}" transform="rotate(-90 55 55)"/></svg><div class="pts">${pct}</div></div>
      <div class="what"><span class="label">${esc(quiz.label)} · ${total}문항</span><b>${right}개 맞음 · ${total-right}개 틀림</b><span class="note">${pct>=70?'2급 합격선(70%)을 넘었습니다.':'2급 합격선은 70%입니다.'}</span></div>
    </div>
    <table class="bytype"><tbody>${Object.entries(by).map(([k,[a,b]])=>`<tr><td><span class="han" style="font-weight:700">${TYPES[k].han}</span> ${TYPES[k].name}</td><td>${a} / ${b}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="cta">
    ${wrong.length?'<button class="btn seal wide" id="rWrong">틀린 문제만 다시</button>':''}
    <button class="btn ${wrong.length?'ghost':''} wide" id="rAgain">같은 설정으로 새로</button>
    <button class="btn ghost wide" id="rBack">설정으로</button>
  </div>
  ${wrong.length?`<div class="sheet"><div class="sec-h"><h2>틀린 문제</h2><span class="sub">오답노트에 저장됐습니다</span></div><div class="wlist">${wrong.map(r=>{const c=r.q.c; const ex=c.ex.slice(0,2).map(e=>`${e.w} ${e.r}`).join(' · ');
      return `<div class="witem"><div class="c">${esc(c.h)}</div><div class="l1">${esc(c.hun)}<small>${c.n}번 · ${TYPES[r.q.t].name}</small></div><div class="l2">${r.mine&&r.mine!=='(직접 씀)'?`내 답 <s>${esc(r.mine)}</s> · `:''}${r.q.e?`<span class="han">${esc(r.q.e.w)}</span> ${esc(r.q.e.r)}`:esc(ex)}</div></div>`;}).join('')}</div></div>`:''}`;
  $('quiz').hidden=true; $('result').hidden=false; window.scrollTo({top:0});
  const w=$('rWrong'); if(w) w.addEventListener('click',()=>{ const plan=wrong.map(r=>build(r.q.t, r.q.c, ALL.slice(S.from-1,S.to), S.typed)); startQuiz(shuffle(plan),'틀린 문제 다시'); });
  $('rAgain').addEventListener('click',()=>{ const [a,b]=clampRange(); startQuiz(makePlan(ALL.slice(a-1,b),S.types), `${a}–${b}번`); });
  $('rBack').addEventListener('click',backToSetup);
}
function backToSetup(){ quiz=null; $('quiz').hidden=true; $('result').hidden=true; $('setup').hidden=false; updatePreview(); window.scrollTo({top:0}); }

/* ---------- tabs ---------- */
function showTab(which){
  const rec = which==='rec';
  $('tabTest').setAttribute('aria-selected', String(!rec)); $('tabRec').setAttribute('aria-selected', String(rec));
  if (rec){ $('setup').hidden=true; $('quiz').hidden=true; $('result').hidden=true; $('records').hidden=false; renderRecords(); }
  else { $('records').hidden=true; $('result').hidden=true; if(quiz && !quiz.saved){ $('quiz').hidden=false; } else { quiz=null; $('quiz').hidden=true; $('setup').hidden=false; updatePreview(); } }
  window.scrollTo({top:0});
}
$('tabTest').addEventListener('click',()=>showTab('test'));
$('tabRec').addEventListener('click',()=>showTab('rec'));

/* ---------- records ---------- */
const fmtDay = ts => { const d=new Date(ts); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtWhen = ts => { const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
function streak(){
  const days = new Set(SESS.map(s=>fmtDay(s.ts))); let n=0; const d=new Date();
  if (!days.has(fmtDay(d.getTime()))) d.setDate(d.getDate()-1);
  while (days.has(fmtDay(d.getTime()))){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function scoreChart(list){
  const W=360, H=170, L=26, Rr=6, T=14, B=22, iw=W-L-Rr, ih=H-T-B;
  const n=list.length, slot=iw/Math.max(n,1), bw=Math.min(28, slot*0.62);
  const y = v => T + ih*(1-v/100);
  let g='';
  for (const v of [0,50,100]) g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text class="axis" x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(70)}" y2="${y(70)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/><text class="axis" x="${W-Rr}" y="${y(70)-4}" text-anchor="end">합격선 70</text>`;
  list.forEach((s,i)=>{
    const pct=Math.round(s.right/s.total*100), cx=L+slot*i+slot/2, x=cx-bw/2, top=y(pct), h=Math.max(ih*(pct/100),1.5), r=Math.min(4,bw/2,h);
    const path=`M${x},${T+ih} L${x},${top+r} Q${x},${top} ${x+r},${top} L${x+bw-r},${top} Q${x+bw},${top} ${x+bw},${top+r} L${x+bw},${T+ih} Z`;
    g+=`<path d="${path}" fill="${pct>=70?'var(--seal)':'var(--muted)'}"/>`;
    g+=`<rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${ih}" fill="transparent" data-i="${i}" class="hit"/>`;
    if (i===n-1 || n<=8) g+=`<text class="axis" x="${cx}" y="${H-8}" text-anchor="middle">${new Date(s.ts).getMonth()+1}/${new Date(s.ts).getDate()}</text>`;
  });
  return `<div class="chartbox" id="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 시험 점수">${g}</svg><div class="tip" id="tip" hidden></div></div>`;
}
function renderRecords(){
  const chars=P.chars; const tried=Object.keys(chars).length; const mastered=Object.values(chars).filter(v=>v[2]===1).length;
  const qTotal=SESS.reduce((a,s)=>a+s.total,0), qRight=SESS.reduce((a,s)=>a+s.right,0);
  const acc = qTotal?Math.round(qRight/qTotal*100):0;
  const grades = GRADES.slice(0,9).map(([g,a,b])=>{ let t=0,m=0; for(let n=a;n<=b;n++){ const v=chars[n]; if(v){t++; if(v[2]===1)m++;} } return {g,a,b,size:b-a+1,t,m}; });
  const recent = SESS.slice(0,20).slice().reverse();
  const weak = Object.entries(chars).filter(([n,v])=>v[1]>0).sort((x,y)=>(y[1][1]-y[1][0]*0.5)-(x[1][1]-x[1][0]*0.5) || y[1][1]-x[1][1]).slice(0,24);
  const empty = !SESS.length && !tried;
  $('records').innerHTML = `
  <div class="tiles">
    <div class="tile"><b>${SESS.length}<small>회</small></b><span>본 시험</span></div>
    <div class="tile"><b>${qTotal.toLocaleString()}<small>문항</small></b><span>정답률 ${acc}%</span></div>
    <div class="tile"><b>${mastered.toLocaleString()}<small>/ 2,355</small></b><span>최근에 맞힌 글자</span></div>
    <div class="tile"><b>${streak()}<small>일</small></b><span>연속 공부</span></div>
  </div>
  ${empty?`<div class="sheet"><p class="empty">아직 기록이 없습니다.<br>시험을 한 번 끝까지 풀면 점수, 급수별 진도, 자주 틀리는 글자가 여기에 쌓입니다.</p><div class="cta"><button class="btn wide" id="goTest">시험 보러 가기</button></div></div>`:''}
  ${recent.length?`<div class="sheet"><div class="sec-h"><h2>최근 점수</h2><span class="sub">최근 ${recent.length}회 · 막대에 손가락을 대면 자세히</span></div>${scoreChart(recent)}</div>`:''}
  ${tried?`<div class="sheet">
    <div class="sec-h"><h2>급수별 진도</h2><span class="sub">연습장 번호 구간 기준</span></div>
    <div class="legend"><span><i style="background:var(--seal)"></i>최근에 맞힌 글자</span><span><i style="background:var(--seal-soft)"></i>풀어 본 글자</span></div>
    <div class="gbars">${grades.map(r=>`<div class="grow"><span class="gl">${r.g}</span><div class="track" title="${r.a}–${r.b}번"><span class="tried" style="width:${r.t/r.size*100}%"></span><span class="mast2" style="width:${r.m/r.size*100}%"></span></div><span class="gn">${r.m} / ${r.t} / ${r.size}</span></div>`).join('')}</div>
    <p class="note" style="margin:0">숫자는 맞힌 글자 / 풀어 본 글자 / 구간 글자 수입니다.</p>
  </div>`:''}
  ${weak.length?`<div class="sheet"><div class="sec-h"><h2>자주 틀리는 글자</h2><span class="sub">틀린 횟수 순</span></div>
    <div class="weak">${weak.map(([n,v])=>`<span title="${n}번 ${esc(BYN.get(+n).hun)}"><span class="han">${esc(BYN.get(+n).h)}</span><small>✕${v[1]}</small></span>`).join('')}</div>
    <div class="cta"><button class="btn ghost" id="weakRun">이 글자들 다시 풀기</button></div></div>`:''}
  ${SESS.length?`<div class="sheet"><div class="sec-h"><h2>시험 기록</h2><span class="sub">눌러서 틀린 글자 보기</span></div><div class="slist" id="slist">${SESS.slice(0,60).map((s,i)=>{const pct=Math.round(s.right/s.total*100);
      return `<button class="srow" data-i="${i}"><span class="d">${fmtWhen(s.ts)}</span><span class="m"><b>${esc(s.label)}</b><span>${Object.keys(s.by||{}).map(k=>TYPES[k]?TYPES[k].name:k).join(' · ')} · ${s.right}/${s.total}</span></span><span class="p ${pct>=70?'pass':''}">${pct}</span></button><div class="sdetail" id="sd${i}" hidden></div>`;}).join('')}</div></div>`:''}
  `;
  const go=$('goTest'); if(go) go.addEventListener('click',()=>showTab('test'));
  const wr=$('weakRun'); if(wr) wr.addEventListener('click',()=>{ const cs=weak.map(([n])=>BYN.get(+n)); const types=S.types.length?S.types:['hun','pick']; const save=S.count; S.count=0; const plan=makePlan(cs,types); S.count=save; showTab('test'); startQuiz(plan,'자주 틀리는 글자'); });
  const sl=$('slist'); if(sl) sl.addEventListener('click',e=>{ const b=e.target.closest('.srow'); if(!b) return; const i=+b.dataset.i, s=SESS[i], box=$('sd'+i);
    if(!box.hidden){ box.hidden=true; return; }
    const w=(s.wrong||[]).filter(x=>BYN.get(x[0]));
    box.innerHTML = w.length?`<div class="weak">${w.map(([n,t])=>`<span title="${esc(BYN.get(n).hun)}"><span class="han">${esc(BYN.get(n).h)}</span><small style="color:var(--muted)">${TYPES[t]?TYPES[t].name:''}</small></span>`).join('')}</div><div class="cta"><button class="btn ghost" data-retry="${i}">이 시험 오답 다시 풀기</button></div>`:'<p class="note" style="margin:0">모두 맞혔습니다.</p>';
    box.hidden=false;
    const rb=box.querySelector('[data-retry]'); if(rb) rb.addEventListener('click',()=>{ const plan=w.map(([n,t])=>build(t,BYN.get(n),ALL.slice(Math.max(0,(s.from||1)-1),s.to||2355),S.typed)); showTab('test'); startQuiz(shuffle(plan),'지난 시험 오답'); });
  });
  const cb=$('chartbox'); if(cb){ const tip=$('tip'); const show=e=>{ const h=e.target.closest('.hit'); if(!h){ tip.hidden=true; return; } const s=recent[+h.dataset.i]; const r=cb.getBoundingClientRect(), hr=h.getBoundingClientRect(); tip.textContent=`${fmtWhen(s.ts)} · ${s.label} · ${s.right}/${s.total} (${Math.round(s.right/s.total*100)}점)`; tip.hidden=false; tip.style.left=Math.min(Math.max(hr.left-r.left+hr.width/2,70),r.width-70)+'px'; tip.style.top=(hr.top-r.top+hr.height*0.15)+'px'; };
    cb.addEventListener('pointermove',show); cb.addEventListener('pointerdown',show); cb.addEventListener('pointerleave',()=>{tip.hidden=true;}); }
}

renderSetup();
initRemote();
</script>
